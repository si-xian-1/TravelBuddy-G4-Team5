services:
  # Database Service
  mysql:
    image: mysql:8.0
    container_name: travelbuddy-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-mysql}
      MYSQL_DATABASE: travelbuddy_db
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - travelbuddy-net

  # TravelBuddy Spring Boot Web Application
  app:
    image: ${DOCKERHUB_USERNAME}/travelbuddy-app:latest
    container_name: travelbuddy-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/travelbuddy_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-mysql}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      TRAVELBUDDY_MOCK_MODE: ${TRAVELBUDDY_MOCK_MODE:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MAPBOX_API_KEY: ${MAPBOX_API_KEY}
      SABRE_CLIENT_ID: ${SABRE_CLIENT_ID}
      SABRE_CLIENT_SECRET: ${SABRE_CLIENT_SECRET}
    networks:
      - travelbuddy-net

volumes:
  mysql-data:
    driver: local

networks:
  travelbuddy-net:
    driver: bridge