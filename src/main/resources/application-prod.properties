spring.application.name=TravelBuddy

spring.config.import=optional:file:.env[.properties]

# MySQL Database configuration
# In Docker, SPRING_DATASOURCE_URL points to mysql:3306; locally defaults to localhost:3306
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/travelbuddy_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mysql}

# Flyway configuration for database migrations and schema seeding
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Spring SQL init mode disabled to let Flyway handle migrations and seeding
spring.sql.init.mode=never

# Prevents long stack from showing in Swagger API
spring.web.error.include-stacktrace=never
# Show only custom error message
spring.web.error.include-message=always
spring.jackson.deserialization.fail-on-unknown-properties=false

# Implement gemini AI model
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.temperature=0.2
spring.ai.google.genai.chat.max-output-tokens=4096

# Set stimulation scenario for disaster warning demo (toggle via TRAVELBUDDY_MOCK_MODE in .env)
travelbuddy.gdacs.mock-mode=${TRAVELBUDDY_MOCK_MODE:true}
travelbuddy.gdacs.mock-file-path=classpath:demo_disasters.json

# Connect to MapBox api for route recommendation
mapbox.api.key=${MAPBOX_API_KEY}

# Sabre API Credentials (create .env file for client id and client secret)
sabre.client-id=${SABRE_CLIENT_ID}
sabre.client-secret=${SABRE_CLIENT_SECRET}
sabre.base-url=https://api.cert.platform.sabre.com