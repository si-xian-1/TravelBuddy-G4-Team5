spring.application.name=TravelBuddy

# For mysql database
# If database not in mysql, autocreate it
spring.datasource.url=jdbc:mysql://localhost:3306/travelbuddy_db?createDatabaseIfNotExist=true
spring.datasource.username=<your mysql username>
spring.datasource.password=<your mysql password>
# Auto creation of database tables in mysql using schema.sql script
spring.sql.init.mode=always

