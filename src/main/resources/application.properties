spring.application.name=TravelBuddy

spring.config.import=optional:file:.env[.properties]

# For mysql database
# If database not in mysql, autocreate it
# can add username and password in .env file as well
spring.datasource.url=jdbc:mysql://localhost:3306/travelbuddy_db?createDatabaseIfNotExist=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Auto creation of database tables in mysql using schema.sql script
spring.sql.init.mode=always

# Prevents long stack from showing in Swagger API
spring.web.error.include-stacktrace=never
# Show only custom error message
spring.web.error.include-message=always

# When we need to integrate AI
# spring.ai.openai.api-key=${OPENAI_KEY}

# The base URL for the Ollama API
spring.ai.ollama.base-url=http://localhost:11434

# Configure the chat client to use a specific model and temperature
spring.ai.ollama.chat.model=phi4-mini
# Set the temperature for the chat model
# A lower temperature makes the model's responses more deterministic
# while a higher temperature allows for more creative responses.
# Adjust this value based on your application's needs.
spring.ai.ollama.chat.temperature=0.7


# Sabre API Credentials (create .env file for client id and client secret)
sabre.client-id=${SABRE_CLIENT_ID}
sabre.client-secret=${SABRE_CLIENT_SECRET}
sabre.base-url=https://api.cert.platform.sabre.com
