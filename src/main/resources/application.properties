spring.application.name=TravelBuddy

# For mysql database
# If database not in mysql, autocreate it
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/travelbuddy_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=<your db root user password>
# Auto creation of database tables in mysql using schema.sql script
spring.sql.init.mode=always

