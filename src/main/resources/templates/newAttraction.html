<!DOCTYPE html>

<html lang="en" xmlns:th="https://www.thymeleaf.org/">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>TravelBuddy - Add Attraction</title>

    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>

<body id="page-top">
    <div id="wrapper">
        <div th:replace="~{fragments/navbar :: navbar(activePage='itinerary')}"></div>

        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">
                <div th:replace="~{fragments/topbar :: topbar}"></div>

                <div class="container-fluid">
                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <h1 class="h3 mb-0 text-gray-800">Add Attraction</h1>
                        <a class="btn btn-secondary shadow-sm" th:href="@{/itinerary/view/{id}(id=${itineraryId})}">
                            <i class="fas fa-arrow-left fa-sm mr-2"></i> Back to Itinerary
                        </a>
                    </div>

                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Attraction Details</h6>
                        </div>
                        <div class="card-body">
                            <div id="attractionError" class="alert alert-danger d-none" role="alert"></div>

                            <form id="attractionForm" th:data-itinerary-id="${itineraryId}" novalidate>

                                <!-- Reusable Autocomplete Wrapper -->
                                <div class="form-group mb-3 position-relative location-autocomplete-wrapper">
                                    <label for="attractionName" class="font-weight-bold">Attraction name</label>

                                    <input type="text" class="form-control location-autocomplete-input"
                                        id="attractionName" name="attractionName" autocomplete="off" maxlength="255">
                                    <div class="invalid-feedback" id="attractionNameError"></div>

                                    <ul class="list-group position-absolute w-100 d-none location-autocomplete-dropdown"></ul>

                                    <input type="hidden" id="attractionLatitude" class="location-autocomplete-lat">
                                    <input type="hidden" id="attractionLongitude" class="location-autocomplete-lon">
                                </div>

                                <div class="form-group mb-4">
                                    <label for="visitDate" class="font-weight-bold">Visit date and time</label>
                                    <input type="datetime-local" class="form-control" id="visitDate" name="visitDate"
                                        data-min-datetime="now">
                                    <div class="invalid-feedback" id="visitDateError"></div>
                                </div>

                                <button type="submit" class="btn btn-primary" id="saveAttractionBtn">
                                    Add Attraction
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{vendor/jquery-easing/jquery.easing.min.js}"></script>

    <!-- Shared Utilities for date validation and location search -->
    <script th:src="@{/js/dateTimeValidation.js}"></script>
    <script th:src="@{/js/detailedItinerary.js}"></script>
    
    <script th:src="@{/js/newAttraction.js}"></script>

    <script th:src="@{/js/sb-admin-2.min.js}"></script>
</body>

</html>
