<!DOCTYPE html>

<html lang="en" xmlns:th="https://www.thymeleaf.org/">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>TravelBuddy - Home</title>

    <!-- Custom fonts for this template-->
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">

    <!--Template custom styling-->
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">

    <!--Own custom styling to overwrite template styling-->
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>



<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">
        <!--Navigation side bar-->
        <div th:replace="~{fragments/navbar :: navbar(activePage='itinerary')}"></div>

        <!-- Page contents -->
        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">
                <!--Top bar for display profile icon-->
                <div th:replace="~{fragments/topbar :: topbar}"></div>

                <!-- Begin Page Content -->
                <div class="container-fluid">

                    <!-- Page Heading -->
                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <h1 class="h3 mb-0 text-gray-800">Add Hotel</h1>
                        <a class="btn btn-secondary shadow-sm"
                            th:href="@{/itinerary/view/{id}(id=${itineraryId})}">
                            <i class="fas fa-arrow-left fa-sm mr-2"></i> Back to Itinerary
                        </a>
                    </div>
                </div>
            </div>
        </div>

<!-- Hotel Details Form -->
<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">Hotel Details</h6>
    </div>
    <div class="card-body">
        <div id="hotelError" class="alert alert-danger d-none" role="alert"></div>

        <form id="hotelForm" th:data-itinerary-id="${itineraryId}" novalidate>
            <!-- Hotel Search -->
            <div class="form-group position-relative">
                <label for="hotelName">Hotel Name or Location</label>
                <input type="text" class="form-control" id="hotelName"
                    name="hotelName" placeholder="Search for a hotel..."
                    maxlength="255" autocomplete="off" required>
                <div class="invalid-feedback" id="hotelNameError"></div>

                <!-- Location API Suggestions -->
                <div id="hotelSuggestions"
                    class="list-group position-absolute w-100 d-none"
                    style="z-index: 1000; max-height: 250px; overflow-y: auto;">
                </div>
            </div>

            <!-- Check-in -->
            <div class="form-group">
                <label for="checkIn">Check-in Date and Time</label>
                <input type="datetime-local" class="form-control"
                    id="checkIn" name="checkIn" required>
                <div class="invalid-feedback" id="checkInError"></div>
            </div>

            <!-- Check-out -->
            <div class="form-group">
                <label for="checkOut">Check-out Date and Time</label>
                <input type="datetime-local" class="form-control"
                    id="checkOut" name="checkOut" required>
                <div class="invalid-feedback" id="checkOutError"></div>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn btn-primary" id="saveHotelBtn">
                Add Hotel
            </button>
        </form>
    </div>
</div>

    </div>

    <!-- Bootstrap core JavaScript-->
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

    <!-- Core plugin JavaScript-->
    <script th:src="@{vendor/jquery-easing/jquery.easing.min.js}"></script>

    <!-- Hotel search autocomplete -->
    <script th:src="@{/js/newHotel.js}"></script>

    <!-- Custom scripts for all pages -->
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
</body>

</html>
