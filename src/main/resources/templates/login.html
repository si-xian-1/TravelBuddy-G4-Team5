<!DOCTYPE html>

<html lang="en" xmlns:th="https://www.thymeleaf.org/">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>TravelBuddy - Login</title>

    <!-- Custom fonts for this template-->
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">

    <!--Template custom styling-->
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">

    <!--Own custom styling to overwrite template styling-->
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>

<body class="bg-gradient-primary">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-xl-10 col-lg-12 col-md-9">

                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <div class="row">
                            <div class="col-lg-6 d-none d-lg-block bg-login-image"></div>
                            <div class="col-lg-6">
                                <div class="p-5">

                                    <div class="text-center">
                                        <h1 class="h4 text-gray-900 mb-4">Welcome Back!</h1>
                                    </div>

                                    <!--Login form-->
                                    <form class="user" id="loginForm">
                                        <!-- General error message -->
                                        <div id="loginErrAlert"
                                            class="alert alert-danger alert-dismissible fade show d-none" role="alert">
                                            <span id="loginErrAlertMsg"></span>
                                            <button type="button" id="loginErrAlertClose" class="close" aria-label="Close">
                                                <span aria-hidden="true">x</span>
                                            </button>
                                        </div>

                                        <!-- Username field -->
                                        <div class="form-group">
                                            <input type="text" class="form-control form-control-user" id="username"
                                                placeholder="Username">
                                            <!-- Error message for username -->
                                            <div class="invalid-feedback" id="usernameErrMsg"></div>
                                        </div>

                                        <!-- Password field -->
                                        <div class="form-group">
                                            <input type="password" class="form-control form-control-user" id="password"
                                                placeholder="Password">
                                            <!-- Error message for password -->
                                            <div class="invalid-feedback" id="passwordErrMsg"></div>
                                        </div>

                                        <!-- Form login button -->
                                        <button type="submit" id="loginBtn" class="btn btn-primary btn-user btn-block">
                                            Login
                                        </button>

                                    </form>

                                    <hr>

                                    <!-- Redirect to sign up page -->
                                    <div class="text-center">
                                        <a class="small" th:href="@{/signup}">Don't have an account yet? Create an
                                            Account!</a>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- Dealing with login form validation -->
    <script th:src="@{/js/login.js}"></script>

    <!-- Bootstrap core JavaScript-->
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

    <!-- Core plugin JavaScript-->
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>

    <!-- Custom scripts for all pages-->
    <script th:src="@{/js/sb-admin-2.min.js}"></script>

</body>

</html>
