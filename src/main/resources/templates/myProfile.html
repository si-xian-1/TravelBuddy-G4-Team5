<!DOCTYPE html>

<html lang="en" xmlns:th="https://www.thymeleaf.org/">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>TravelBuddy - My Profile</title>

    <!-- Custom fonts for this template-->
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">

    <!--Template custom styling-->
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">

    <!--Own custom styling to overwrite template styling-->
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>



<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">
        <!--Navigation side bar-->
        <div th:replace="~{fragments/navbar :: navbar(activePage='profile')}"></div>

        <!-- Page contents -->
        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">
                <!--Top bar for display profile icon-->
                <div th:replace="~{fragments/topbar :: topbar}"></div>

                <!-- Begin Page Content -->
                <div class="container-fluid">

                    <!-- Page Heading -->
                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <h1 class="h3 mb-0 text-gray-800">My Profile</h1>
                    </div>

                    <div id="profileError" class="alert alert-danger d-none" role="alert">
                        Unable to load your profile. Please refresh the page or sign in again.
                    </div>

                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Traveler Details</h6>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <p class="mb-3">
                                        <strong>Username:</strong>
                                        <span id="profileUsername">Loading...</span>
                                    </p>
                                    <p class="mb-3">
                                        <strong>Mobile Number:</strong>
                                        <span id="profileMobileNumber">Loading...</span>
                                    </p>
                                    <p class="mb-3">
                                        <strong>Location Consent:</strong>
                                        <span id="profileLocationConsent">Loading...</span>
                                    </p>
                                </div>
                                <div class="col-md-6">
                                    <p class="mb-3">
                                        <strong>Emergency Contact Name:</strong>
                                        <span id="profileEmergencyContactName">Loading...</span>
                                    </p>
                                    <p class="mb-3">
                                        <strong>Emergency Contact Number:</strong>
                                        <span id="profileEmergencyContactNumber">Loading...</span>
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap core JavaScript-->
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

    <!-- Core plugin JavaScript-->
    <script th:src="@{vendor/jquery-easing/jquery.easing.min.js}"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            try {
                const response = await fetch("/api/travelers/myProfile", {
                    credentials: "same-origin"
                });

                if (!response.ok) {
                    throw new Error(`Profile request failed with status ${response.status}`);
                }

                const traveler = await response.json();
                const displayValue = value => value == null || value === "" ? "Not provided" : value;

                document.getElementById("profileUsername").textContent = displayValue(traveler.username);
                document.getElementById("profileMobileNumber").textContent = displayValue(traveler.mobileNumber);
                document.getElementById("profileLocationConsent").textContent =
                    traveler.hasConsentLocation == null
                        ? "Not provided"
                        : traveler.hasConsentLocation ? "Yes" : "No";
                document.getElementById("profileEmergencyContactName").textContent =
                    displayValue(traveler.emergencyContactName);
                document.getElementById("profileEmergencyContactNumber").textContent =
                    displayValue(traveler.emergencyContactMobileNumber);
            } catch (error) {
                console.error("Unable to load traveler profile:", error);
                document.getElementById("profileError").classList.remove("d-none");
            }
        });
    </script>

    <!-- Custom scripts for all pages-->
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
</body>

</html>
