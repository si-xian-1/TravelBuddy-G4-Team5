<!DOCTYPE html>

<html lang="en" xmlns:th="https://www.thymeleaf.org/">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>TravelBuddy - Add Flight</title>

    <!-- Custom fonts for this template-->
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">

    <!--Template custom styling-->
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">

    <!--Own custom styling to overwrite template styling-->
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">
        <!--Navigation side bar-->
        <div th:replace="~{fragments/navbar :: navbar(activePage='itinerary')}"></div>

        <!-- Page contents -->
        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">
                <!--Top bar for display profile icon-->
                <div th:replace="~{fragments/topbar :: topbar}"></div>

                <!-- Begin Page Content -->
                <div class="container-fluid">

                    <!-- Page Heading -->
                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <h1 class="h3 mb-0 text-gray-800">Add Flight</h1>
                        <a class="btn btn-secondary shadow-sm" th:href="@{/itinerary/view/{id}(id=${itineraryId})}">
                            <i class="fas fa-arrow-left fa-sm mr-2"></i> Back to Itinerary
                        </a>
                    </div>

                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-success">Flight Details</h6>
                        </div>
                        <div class="card-body">
                            <div id="flightError" class="alert alert-danger d-none" role="alert"></div>

                            <form id="flightForm" th:data-itinerary-id="${itineraryId}" novalidate>
                                <div class="form-row">
                                    <div class="form-group col-md-6">
                                        <label for="airline">Airline</label>
                                        <input type="text" class="form-control" id="airline" maxlength="255">
                                        <div class="invalid-feedback" id="airlineError"></div>
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="flightNumber">Flight number</label>
                                        <input type="text" class="form-control" id="flightNumber" maxlength="50">
                                        <div class="invalid-feedback" id="flightNumberError"></div>
                                    </div>
                                </div>

                                <div class="form-row">
                                    <!-- Departure Airport Search -->
                                    <div class="form-group col-md-6 position-relative location-autocomplete-wrapper">
                                        <label for="departureAirport">Departure airport</label>
                                        <input type="text" class="form-control location-autocomplete-input"
                                            id="departureAirport" maxlength="100" autocomplete="off">
                                        <div class="invalid-feedback" id="departureAirportError"></div>

                                        <ul class="list-group position-absolute w-100 d-none location-autocomplete-dropdown"></ul>

                                        <input type="hidden" id="departureLatitude" class="location-autocomplete-lat">
                                        <input type="hidden" id="departureLongitude" class="location-autocomplete-lon">
                                    </div>

                                    <!-- Arrival Airport Search -->
                                    <div class="form-group col-md-6 position-relative location-autocomplete-wrapper">
                                        <label for="arrivalAirport">Arrival airport</label>
                                        <input type="text" class="form-control location-autocomplete-input"
                                            id="arrivalAirport" maxlength="100" autocomplete="off">
                                        <div class="invalid-feedback" id="arrivalAirportError"></div>

                                        <ul class="list-group position-absolute w-100 d-none location-autocomplete-dropdown"></ul>

                                        <input type="hidden" id="arrivalLatitude" class="location-autocomplete-lat">
                                        <input type="hidden" id="arrivalLongitude" class="location-autocomplete-lon">
                                    </div>
                                </div>

                                <div class="form-row">
                                    <div class="form-group col-md-6">
                                        <label for="departureTime">Departure date and time</label>
                                        <input type="datetime-local" class="form-control" id="departureTime">
                                        <div class="invalid-feedback" id="departureTimeError"></div>
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="arrivalTime">Arrival date and time</label>
                                        <input type="datetime-local" class="form-control" id="arrivalTime">
                                        <div class="invalid-feedback" id="arrivalTimeError"></div>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-success" id="saveFlightBtn">
                                    Add Flight
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap core JavaScript-->
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

    <!-- Core plugin JavaScript-->
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>

    <!-- Shared Utilities for date validation and location search -->
    <script th:src="@{/js/dateTimeValidation.js}"></script>
    <script th:src="@{/js/detailedItinerary.js}"></script>
    
    <script th:src="@{/js/newFlight.js}"></script>

    <!-- Custom scripts for all pages-->
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
</body>

</html>
