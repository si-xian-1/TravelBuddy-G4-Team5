<!DOCTYPE html>

<html lang="en" xmlns:th="https://www.thymeleaf.org/">

<!--Create a navbar fragment for reusability across pages-->
<body>
    <!-- Sidebar -->
        <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar" th:fragment="navbar">

            <!-- Sidebar - Brand -->
            <a class="sidebar-brand d-flex align-items-center justify-content-center" th:href="@{/home}">
                <div class="sidebar-brand-icon rotate-n-15">
                    <i class="fas fa-solid fa-passport"></i>
                </div>
                <div class="sidebar-brand-text mx-2">Travel Buddy</div>
            </a>

            <!-- Divider -->
            <hr class="sidebar-divider my-0">

            <!-- Nav Item - Dashboard -->
            <li class="nav-item" th:classappend="${activePage == 'dashboard'} ? 'active' : ''">
                <a class="nav-link" th:href="@{/home}">
                    <i class="fas fa-solid fa-plane"></i>
                    <span>Dashboard</span></a>
            </li>

            <!-- Nav Item - Itineraries -->
            <li class="nav-item" th:classappend="${activePage == 'itinerary'} ? 'active' : ''">
                <a class="nav-link" th:href="@{/allItineraries}">
                    <i class="fas fa-solid fa-suitcase-rolling"></i>
                    <span>My itineraries</span></a>
            </li>

            <!-- Nav Item - Profile -->
            <li class="nav-item" th:classappend="${activePage == 'profile'} ? 'active' : ''">
                <a class="nav-link" th:href="@{/myProfile}">
                    <i class="fas fa-solid fa-user"></i>
                    <span>My profile</span></a>
            </li>

            <!-- Sidebar Toggler (Sidebar) -->
            <div class="text-center d-none d-md-inline">
                <button class="rounded-circle border-0" id="sidebarToggle"></button>
            </div>

        </ul>
        <!-- End of Sidebar -->
</body>
</html>
