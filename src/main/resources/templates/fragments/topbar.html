<!DOCTYPE html>

<html lang="en" xmlns:th="https://www.thymeleaf.org/">

<!--Create a topbar fragment for profile icon display for reusability across pages-->

<body>
    <!-- Topbar -->
    <div th:fragment="topbar">
        <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">

            <!-- Sidebar Toggle (Topbar) -->
            <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
                <i class="fa fa-bars"></i>
            </button>

            <!-- Topbar Navbar -->
            <ul class="navbar-nav ml-auto">

                <!-- User Information -->
                <li class="nav-item dropdown no-arrow">
                    <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown"
                        aria-haspopup="true" aria-expanded="false">
                        <!-- Show current login username -->
                        <span class="mr-2 d-none d-lg-inline text-gray-600 small" th:text="${username}"></span>
                        <img class="img-profile rounded-circle" th:src="@{/img/profile_icon.svg}">
                    </a>
                    <!-- Dropdown - User Information -->
                    <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in"
                        aria-labelledby="userDropdown">
                        <a class="dropdown-item" th:href="@{/myProfile}">
                            <i class="fas fa-user fa-sm fa-fw mr-2 text-gray-400"></i>
                            Profile
                        </a>
                        <div class="dropdown-divider"></div>
                        <!--Logout-->
                        <a class="dropdown-item" href="#" id="logoutBtn">
                            <i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i>
                            Logout
                        </a>
                    </div>
                </li>

            </ul>

        </nav>
        <!-- End of Topbar -->

        <!-- Clear current authenticated user http session -->
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const logout = document.getElementById("logoutBtn");

                if (!logout) {
                    return;
                }

                logout.addEventListener("click", async function (event) {
                    event.preventDefault();
                    // Call POST method to logout this user
                    const response = await fetch("/api/travelers/logout", {
                        method: "POST",
                        credentials: "same-origin"
                    });

                    if (response.ok || response.status === 204) {
                        // When successful logout, redirect to login page
                        window.location.href = "/login";
                    } else {
                        // When logout unsuccessful
                        console.error("Logout failed");
                    }
                });
            });
        </script>
    </div>
</body>

</html>
