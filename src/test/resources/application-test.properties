spring.application.name=TravelBuddy

# Use in-memory H2 database with MySQL compatibility mode for integration tests
spring.datasource.url=jdbc:h2:mem:travelbuddy_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never

# Enable Flyway migrations on H2 test database
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Test / mock credentials for external service beans
spring.ai.google.genai.api-key=test-gemini-api-key
spring.ai.google.genai.chat.model=gemini-2.0-flash
spring.ai.google.genai.chat.temperature=0.2
sabre.client-id=test-sabre-client-id
sabre.client-secret=test-sabre-secret
sabre.base-url=https://api.cert.platform.sabre.com
sabre.flight-mock=true
sabre.hotel-mock=true
travelbuddy.gdacs.mock-mode=true
travelbuddy.gdacs.mock-file-path=classpath:demo_disasters.json
mapbox.api.key=test-mapbox-key
